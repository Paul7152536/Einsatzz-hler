name: Android-App bauen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: ZIP auspacken
        id: src
        run: |
          ZIP=$(ls -1 ./*.zip | sort -V | tail -1)
          echo "Benutze $ZIP"
          mkdir -p paket
          unzip -o "$ZIP" -d paket
          DIR=$(dirname "$(find paket -name package.json | head -1)")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
      - name: App-Dateien vorbereiten
        working-directory: ${{ steps.src.outputs.dir }}
        run: |
          mkdir -p www
          cp index.html www/
      - name: Pakete installieren
        working-directory: ${{ steps.src.outputs.dir }}
        run: npm install
      - name: Android-Projekt erzeugen
        working-directory: ${{ steps.src.outputs.dir }}
        run: npx cap add android
      - name: Kamera-Berechtigung eintragen
        working-directory: ${{ steps.src.outputs.dir }}
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Dateien in die App kopieren
        working-directory: ${{ steps.src.outputs.dir }}
        run: npx cap sync android
      - name: APK bauen
        working-directory: ${{ steps.src.outputs.dir }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Einsatz-App-APK
          path: ${{ steps.src.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
